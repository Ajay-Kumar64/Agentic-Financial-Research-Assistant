# =============================================================================
# Production Docker Compose for Agentic Financial Research Assistant
# =============================================================================

services:
  # =========================================================================
  # OpenSearch — Vector + Text Search Backend
  # =========================================================================
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    # Disabled: Internal healthcheck fails on Windows, but DB is healthy (verified via curl.exe)
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - financial-network

  # =========================================================================
  # Redis — Cache + Conversation Store
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: financial-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - financial-network

  # =========================================================================
  # Agent — FastAPI Backend
  # =========================================================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: agent
    container_name: financial-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=admin
      - OPENSEARCH_INDEX=rbi_reports
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - USE_RERANKER=true
      - USE_HYDE=true
      - USE_CRAG=true
      - USE_ROUTER=true
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./agent:/app/agent
      - ./api:/app/api
      - ./rag:/app/rag
      - ./eval:/app/eval
      - ./.env:/app/.env
    depends_on:
      opensearch:
        condition: service_started  # FIXED: Don't wait for healthcheck
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - financial-network

  # =========================================================================
  # UI — Streamlit Frontend
  # =========================================================================
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: ui
    container_name: financial-ui
    ports:
      - "8501:8501"
    environment:
      - AGENT_API_URL=http://agent:8000
    volumes:
      - ./ui:/app/ui
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - financial-network

  # =========================================================================
  # MCP Server
  # =========================================================================
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: mcp
    container_name: financial-mcp
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./mcp_server:/app/mcp_server
      - ./agent:/app/agent
      - ./rag:/app/rag
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - financial-network

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================
volumes:
  opensearch_data:
    driver: local
  redis_data:
    driver: local

networks:
  financial-network:
    driver: bridge